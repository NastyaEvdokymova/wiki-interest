[project]
name = "wiki-interest"
version = "0.1.0"
description = "Estimate interest in a topic from Wikipedia page views across language editions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed only for `report`; the core (resolve/fetch/analyze/compare) works without them.
report = [
    "matplotlib>=3.8",
    "reportlab>=4.0",
]

[project.scripts]
wikitrends = "wikitrends.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikitrends"]
